name: Dependency Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact lock without package scripts
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record audited version
        working-directory: apps/web
        run: |
          { git rev-parse HEAD; node --version; npm --version; sha256sum package.json package-lock.json; } > "$RUNNER_TEMP/izo-dependency-versions.txt"
      - name: Audit all dependencies (high and critical block)
        id: audit
        working-directory: apps/web
        run: npm audit --registry=https://registry.npmjs.org --include=dev --include=optional --include=peer --audit-level=high --json > "$RUNNER_TEMP/izo-dependency-audit.json"
      - name: Prepare and probe the exact SEC-001 patch outside the checkout
        if: ${{ failure() && steps.audit.outcome == 'failure' && github.head_ref == 'security/npm-audit' }}
        working-directory: apps/web
        run: |
          mkdir "$RUNNER_TEMP/izo-sec001-candidate"
          cat > "$RUNNER_TEMP/izo-sec001-probe.cjs" <<'JS'
          const { createRequire } = require('node:module');
          const { join } = require('node:path');
          const req = createRequire(join(process.cwd(), 'package.json'));
          const parser = createRequire(req.resolve('@redocly/openapi-core'));
          const yaml = parser('js-yaml');
          let rejected = false;
          try { yaml.load('base: &e [{}, {}, {}, {}]\nvalue: {<<: *e}\n', { maxTotalMergeKeys: 2 }); }
          catch (err) { if (!/maxTotalMergeKeys/.test(err.message)) throw err; rejected = true; }
          require('node:assert/strict').deepEqual(yaml.load('a: &a {kind: image}\nb: {<<: *a, count: 1}\n', { maxTotalMergeKeys: 8 }).b, {kind:'image',count:1});
          console.log(JSON.stringify({parser: parser('js-yaml/package.json').version, emptyMergeBudgetEnforced: rejected, normalMerge: true}));
          if (process.argv[2] === 'patched' && !rejected) process.exit(1);
          JS
          node "$RUNNER_TEMP/izo-sec001-probe.cjs" > "$RUNNER_TEMP/izo-sec001-candidate/probe-before.json"
          cp package.json package-lock.json "$RUNNER_TEMP/izo-sec001-candidate/"
          cd "$RUNNER_TEMP/izo-sec001-candidate"
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.overrides={'@redocly/openapi-core@1.34.19':{'js-yaml':'4.3.2'}}; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --registry=https://registry.npmjs.org --package-lock-only --include=dev --include=optional --include=peer --audit-level=high --json > audit-after.json
          npm ci --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/izo-sec001-probe.cjs" patched > probe-after.json
      - name: Save candidate for review (never commit automatically)
        if: ${{ always() && github.head_ref == 'security/npm-audit' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sec001-candidate
          path: ${{ runner.temp }}/izo-sec001-candidate/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Save audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit
          path: |
            ${{ runner.temp }}/izo-dependency-audit.json
            ${{ runner.temp }}/izo-dependency-versions.txt
          retention-days: 7
          if-no-files-found: error
