name: Dependency Security
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - name: Install pinned Python audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit pinned Python runtime dependencies
        run: python -m pip_audit --disable-pip --no-deps --progress-spinner off -r requirements.lock --format json > "$RUNNER_TEMP/izo-python-dependency-audit.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact lock without package scripts
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record audited versions
        run: |
          {
            git rev-parse HEAD
            python --version
            python -m pip_audit --version
            sha256sum requirements.in requirements.lock
            cd apps/web
            node --version
            npm --version
            sha256sum package.json package-lock.json
          } > "$RUNNER_TEMP/izo-dependency-versions.txt"
      - name: Audit all dependencies (high and critical block)
        working-directory: apps/web
        run: npm audit --registry=https://registry.npmjs.org --include=dev --include=optional --include=peer --audit-level=high --json > "$RUNNER_TEMP/izo-dependency-audit.json"
      - name: Verify the resolved parser and bounded security regression
        working-directory: apps/web
        run: node --test security/dependencies.test.mjs
      - name: Save audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit
          path: |
            ${{ runner.temp }}/izo-python-dependency-audit.json
            ${{ runner.temp }}/izo-dependency-audit.json
            ${{ runner.temp }}/izo-dependency-versions.txt
          retention-days: 7
          if-no-files-found: error
