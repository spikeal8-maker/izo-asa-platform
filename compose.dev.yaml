name: izo-chat-dev
x-api-env: &api-env
  IZO_ENVIRONMENT: development
  IZO_PG_HOST: postgres
  IZO_PG_PASSWORD: ${IZO_PG_PASSWORD:?Missing IZO_PG_PASSWORD in .env.dev}
  IZO_S3_ENDPOINT: http://storage:8333
  IZO_S3_ACCESS_KEY: ${IZO_S3_ACCESS_KEY:?Missing IZO_S3_ACCESS_KEY}
  IZO_S3_SECRET_KEY: ${IZO_S3_SECRET_KEY:?Missing IZO_S3_SECRET_KEY}
  IZO_BUILD_SHA: unreleased
  IZO_AUTH_RATE_SECRET: ${IZO_AUTH_RATE_SECRET:?Missing IZO_AUTH_RATE_SECRET}
  IZO_AUTH_REGISTRATION: open
  IZO_AUTH_ORIGINS: '["http://localhost:${IZO_DEV_PORT:-5190}","http://127.0.0.1:${IZO_DEV_PORT:-5190}"]'
  IZO_RECOVERY_SECRET: ${IZO_RECOVERY_SECRET:-}
  IZO_RECOVERY_DELIVERY: disabled
  IZO_JOBS_ENABLED: 'false'
  IZO_GUEST_ENABLED: 'false'
  IZO_FAL_ENABLED: 'false'

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: izo
      POSTGRES_DB: izo
      POSTGRES_PASSWORD: ${IZO_PG_PASSWORD:?Missing IZO_PG_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U izo -d izo']
      interval: 3s
      timeout: 3s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.29
    command: [mini, '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${IZO_S3_ACCESS_KEY:?Missing IZO_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${IZO_S3_SECRET_KEY:?Missing IZO_S3_SECRET_KEY}
      S3_BUCKET: izo-private
    volumes: [objects:/data]
    networks: [private]

  migrate:
    image: izo-chat-dev-api:local
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment: *api-env
    command: [python, '-m', alembic, upgrade, head]
    volumes:
      - ./apps/api:/app/apps/api:ro
    networks: [private]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: izo-chat-dev-api:local
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      <<: *api-env
      IZO_CHAT_ROOT_KEY: ${IZO_CHAT_ROOT_KEY:?Missing IZO_CHAT_ROOT_KEY}
      IZO_CHAT_PREVIEW_ACCOUNT_EMAILS: preview@local.izo
      IZO_CHAT_LOCAL_PREVIEW_ENABLED: 'true'
    command:
      - python
      - -m
      - uvicorn
      - izo.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --reload
      - --reload-dir
      - /app/apps/api
      - --no-proxy-headers
      - --no-access-log
    volumes:
      - ./apps/api:/app/apps/api:ro
    networks: [private, chat-egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
    healthcheck:
      test: [CMD, python, '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=8)"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s

  web:
    image: izo-chat-dev-web:local
    build: {context: ., dockerfile: infra/web.dev.Dockerfile}
    environment:
      IZO_VITE_API_TARGET: http://api:8000
      IZO_VITE_DOCKER: 'true'
      IZO_VITE_HMR_CLIENT_PORT: ${IZO_DEV_PORT:-5190}
    command: [npx, vite, --host, 0.0.0.0, --port, '5173', --strictPort]
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
    ports:
      - '127.0.0.1:${IZO_DEV_PORT:-5190}:5173'
    networks: [private, edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  postgres-data:
  objects:

networks:
  private: {internal: true}
  chat-egress: {}
  edge: {}
